<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>提篮拱桥 - 三维参数化模型 (可旋转/可调参/导出OBJ)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #111;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(20, 20, 30, 0.7);
            padding: 15px 25px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            border-left: 4px solid #ffaa00;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 10;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 20px;
            background: rgba(30, 30, 40, 0.85);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            pointer-events: auto;
            z-index: 20;
            width: 300px;
            border: 1px solid #444;
        }
        #controls h3 {
            margin: 0 0 15px 0;
            text-align: center;
            color: #ffaa00;
            font-weight: 400;
            letter-spacing: 2px;
        }
        .slider-container {
            margin-bottom: 18px;
        }
        .slider-container label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
            color: #ddd;
        }
        .slider-container input {
            width: 100%;
            cursor: pointer;
            accent-color: #ffaa00;
        }
        .value-display {
            color: #ffaa00;
            font-weight: bold;
        }
        button {
            background: #ffaa00;
            color: #111;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 8px;
            transition: all 0.2s;
            border: 1px solid #ffbb33;
        }
        button:hover {
            background: #ffc34d;
            box-shadow: 0 0 15px #ffaa00aa;
        }
        .btn-export-obj {
            background: #4a6fa5;
            border-color: #5f8cc9;
            color: white;
            margin-top: 4px;
        }
        .btn-export-obj:hover {
            background: #5f8cc9;
        }
        #output-panel {
            position: absolute;
            bottom: 30px;
            right: 20px;
            background: rgba(20, 20, 30, 0.9);
            color: #0f0;
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            width: 400px;
            max-height: 350px;
            overflow: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border: 1px solid #2a6f2a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: auto;
            z-index: 15;
            display: none;
        }
        #output-panel pre {
            margin: 5px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        #close-output {
            float: right;
            background: #333;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 8px;
        }
        #toggle-output-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            width: auto;
            padding: 10px 20px;
            background: #2a6f2a;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            z-index: 25;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #status {
            position: absolute;
            bottom: 30px;
            left: 350px;
            color: #ccc;
            background: rgba(0,0,0,0.4);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            z-index: 5;
        }
        .note {
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
            text-align: center;
        }
        body.embed #info {
            top: 12px;
            left: 12px;
            padding: 10px 14px;
            max-width: 360px;
        }
        body.embed #info h2 {
            font-size: 18px;
            margin: 0 0 6px;
        }
        body.embed #info p {
            font-size: 12px;
            margin: 4px 0;
        }
        body.embed #controls {
            top: 12px;
            right: 12px;
            bottom: auto;
            left: auto;
            width: 255px;
            padding: 14px 16px;
        }
        body.embed #controls h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }
        body.embed .slider-container {
            margin-bottom: 10px;
        }
        body.embed .slider-container label {
            font-size: 12px;
        }
        body.embed button {
            padding: 8px 10px;
            font-size: 13px;
        }
        body.embed .note,
        body.embed #status {
            display: none;
        }
        body.embed #toggle-output-btn {
            right: 12px;
            bottom: 12px;
            font-size: 13px;
            padding: 8px 12px;
        }
        body.embed #output-panel {
            right: 12px;
            bottom: 56px;
            width: 360px;
            max-height: 260px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>🌉 提篮拱桥 (Basket-handle Arch)</h2>
        <p>主梁: 0-50m | 宽10m | 高1m | 横梁间距5m | 拱高15m</p>
        <p>🖱️ 鼠标拖动旋转 / 滚轮缩放 | 右键平移</p>
    </div>
    <div id="status">👆 拖动滑块实时调整参数</div>

    <!-- 参数控制面板 -->
    <div id="controls">
        <h3>📐 参数调节</h3>
        <div class="slider-container">
            <label>📏 跨度 (Span) <span id="span-val" class="value-display">50.0</span> m</label>
            <input type="range" id="span-slider" min="30" max="80" step="1" value="50">
        </div>
        <div class="slider-container">
            <label>🏔️ 拱高 (Arch Height) <span id="arch-val" class="value-display">15.0</span> m</label>
            <input type="range" id="arch-slider" min="5" max="30" step="0.5" value="15">
        </div>
        <div class="slider-container">
            <label>📌 横梁间距 <span id="spacing-val" class="value-display">5.0</span> m</label>
            <input type="range" id="spacing-slider" min="2" max="10" step="0.5" value="5">
        </div>
        <button id="export-btn">📊 输出节点坐标 & 单元信息</button>
        <button id="export-obj-btn" class="btn-export-obj">📦 导出OBJ模型</button>
        <div class="note">横梁跨度固定10m | 拱肋提篮形态 (y: ±6→±1→±6)</div>
    </div>

    <!-- 输出面板切换按钮 -->
    <button id="toggle-output-btn">📋 显示/隐藏 节点单元数据</button>

    <!-- 输出数据面板 -->
    <div id="output-panel">
        <button id="close-output">✖ 关闭</button>
        <h4 style="margin:0 0 10px; color:#ffaa00;">📄 节点坐标 (Node Coordinates) & 单元信息 (Elements)</h4>
        <pre id="output-content">点击“输出节点坐标”按钮生成数据...</pre>
        <small style="color:#aaa;">格式: 节点ID, x, y, z | 单元: 类型, 节点1, 节点2</small>
    </div>

    <!-- 引入Three.js 核心库、扩展及OBJ导出器 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        import { OBJExporter } from 'three/addons/exporters/OBJExporter.js';  // 导入OBJ导出器

        const query = new URLSearchParams(window.location.search);
        if (query.get('embed') === '1') {
            document.body.classList.add('embed');
        }

        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);
        
        // --- 相机 ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(40, 30, 40);
        camera.lookAt(25, 0, 8);
        
        // --- 渲染器 ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- CSS2渲染器用于文字标签 ---
        const css2DRenderer = new CSS2DRenderer();
        css2DRenderer.setSize(window.innerWidth, window.innerHeight);
        css2DRenderer.domElement.style.position = 'absolute';
        css2DRenderer.domElement.style.top = '0px';
        css2DRenderer.domElement.style.left = '0px';
        css2DRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(css2DRenderer.domElement);

        // --- 轨道控制器 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.target.set(25, 0, 8);
        controls.update();

        // --- 光照 ---
        scene.add(new THREE.AmbientLight(0x404060, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.receiveShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 60;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);
        
        const fillLight1 = new THREE.PointLight(0x4466ff, 0.5);
        fillLight1.position.set(-10, 20, 20);
        scene.add(fillLight1);
        const fillLight2 = new THREE.PointLight(0xffaa66, 0.4);
        fillLight2.position.set(60, 15, 10);
        scene.add(fillLight2);
        
        // 辅助网格和轴线
        const gridHelper = new THREE.GridHelper(100, 20, 0x88aaff, 0x334466);
        gridHelper.position.y = 0;
        scene.add(gridHelper);
        const axesHelper = new THREE.AxesHelper(30);
        scene.add(axesHelper);
        
        // 星空装饰
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 1000;
        const starPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i+=3) {
            starPositions[i] = (Math.random() - 0.5) * 200;
            starPositions[i+1] = (Math.random() - 0.5) * 200;
            starPositions[i+2] = (Math.random() - 0.5) * 200;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 0.15});
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        function createLabel(text, position, color = '#ffaa00') {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = '#fff';
            div.style.fontSize = '14px';
            div.style.fontWeight = 'bold';
            div.style.textShadow = '1px 1px 3px black';
            div.style.background = 'rgba(20,20,40,0.7)';
            div.style.padding = '2px 8px';
            div.style.borderRadius = '4px';
            div.style.borderLeft = `3px solid ${color}`;
            const label = new CSS2DObject(div);
            label.position.copy(position);
            return label;
        }
        const labelGroup = new THREE.Group();
        scene.add(labelGroup);

        function refreshLabels(span, archH) {
            labelGroup.clear();
            labelGroup.add(createLabel('起点 (0,0,0)', new THREE.Vector3(0, -2, 2), '#ff5555'));
            labelGroup.add(createLabel(`终点 (${span.toFixed(0)},0,0)`, new THREE.Vector3(span, -2, 2), '#ff5555'));
            labelGroup.add(createLabel('拱顶', new THREE.Vector3(span / 2, 0, archH + 3), '#55ff55'));
        }

        // --- 桥梁模型容器 ---
        let bridgeGroup = new THREE.Group();
        scene.add(bridgeGroup);
        let hasFramedInitialView = false;

        // --- 拱肋坐标计算 ---
        function getArchCoords(x, L, H, side = 1) {
            const t = x / L;
            const z = 4 * H * t * (1 - t);
            const a = 20 / (L * L);
            const y_mag = a * Math.pow(x - L/2, 2) + 1;
            const y = side * y_mag;
            return { y, z };
        }

        // --- 重建桥梁模型 ---
        function rebuildBridge() {
            const span = parseFloat(document.getElementById('span-slider').value);
            const archH = parseFloat(document.getElementById('arch-slider').value);
            const spacing = parseFloat(document.getElementById('spacing-slider').value);
            
            document.getElementById('span-val').textContent = span.toFixed(1);
            document.getElementById('arch-val').textContent = archH.toFixed(1);
            document.getElementById('spacing-val').textContent = spacing.toFixed(1);
            document.querySelector('#info p').textContent = `主梁: 0-${span.toFixed(0)}m | 宽10m | 高1m | 横梁间距${spacing.toFixed(1)}m | 拱高${archH.toFixed(1)}m`;
            controls.target.set(span / 2, 0, Math.max(archH * 0.45, 6));
            if (!hasFramedInitialView) {
                camera.position.set(span * 0.5, -span * 1.18, Math.max(archH * 1.85, 38));
                hasFramedInitialView = true;
            }
            controls.update();
            refreshLabels(span, archH);
            
            // 清空旧模型
            while(bridgeGroup.children.length > 0) {
                bridgeGroup.remove(bridgeGroup.children[0]);
            }
            
            const deckWidth = 10.0;
            const deckHeight = 1.0;
            const beamWidth = 10.0;
            const beamBelow = 1.0;
            
            const beamPositions = [];
            for (let x = 0; x <= span + 0.01; x += spacing) {
                beamPositions.push(Math.min(x, span));
            }
            if (!beamPositions.includes(span)) beamPositions.push(span);
            beamPositions.sort((a,b)=>a-b);
            
            // 主梁
            const deckMaterial = new THREE.MeshStandardMaterial({ color: 0x88aacc, roughness: 0.5, metalness: 0.2, transparent: true, opacity: 0.85 });
            const deckGeo = new THREE.BoxGeometry(span, deckWidth, deckHeight);
            const deck = new THREE.Mesh(deckGeo, deckMaterial);
            deck.castShadow = true;
            deck.receiveShadow = true;
            deck.position.set(span/2, 0, deckHeight/2);
            bridgeGroup.add(deck);
            
            const edges = new THREE.EdgesGeometry(deckGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x2c3e50 }));
            line.position.copy(deck.position);
            bridgeGroup.add(line);
            
            // 横梁
            const beamMaterial = new THREE.MeshStandardMaterial({ color: 0xcc9966, roughness: 0.7 });
            const beamHeight = 0.25;
            const beamDepth = 0.4;
            beamPositions.forEach(x => {
                const beamGeo = new THREE.BoxGeometry(beamDepth, beamWidth, beamHeight);
                const beam = new THREE.Mesh(beamGeo, beamMaterial);
                beam.castShadow = true;
                beam.receiveShadow = true;
                beam.position.set(x, 0, -beamBelow - beamHeight/2);
                bridgeGroup.add(beam);
            });
            
            // 拱肋
            const pointsRight = [];
            const pointsLeft = [];
            const steps = 50;
            for (let i = 0; i <= steps; i++) {
                const x = (i / steps) * span;
                const { y, z } = getArchCoords(x, span, archH, 1);
                pointsRight.push(new THREE.Vector3(x, y, z));
                pointsLeft.push(new THREE.Vector3(x, -y, z));
            }
            
            function createArchTube(points) {
                const curve = new THREE.CatmullRomCurve3(points);
                const tubeGeo = new THREE.TubeGeometry(curve, 80, 0.25, 8, false);
                const tubeMat = new THREE.MeshStandardMaterial({ color: 0xcc8844, roughness: 0.5, metalness: 0.2 });
                const tube = new THREE.Mesh(tubeGeo, tubeMat);
                tube.castShadow = true;
                tube.receiveShadow = true;
                return tube;
            }
            
            bridgeGroup.add(createArchTube(pointsRight));
            bridgeGroup.add(createArchTube(pointsLeft));
            
            const lineMat = new THREE.LineBasicMaterial({ color: 0xffaa00 });
            bridgeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pointsRight), lineMat));
            bridgeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pointsLeft), lineMat));
            
            // 吊杆
            const hangerMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.3, metalness: 0.6 });
            const zBeam = -beamBelow - 0.125;
            beamPositions.forEach(x => {
                const rightArch = getArchCoords(x, span, archH, 1);
                const leftArch = getArchCoords(x, span, archH, -1);
                const rightTop = new THREE.Vector3(x, rightArch.y, rightArch.z);
                const rightBottom = new THREE.Vector3(x, 5, zBeam);
                const leftTop = new THREE.Vector3(x, leftArch.y, leftArch.z);
                const leftBottom = new THREE.Vector3(x, -5, zBeam);
                
                [{ top: rightTop, bottom: rightBottom }, { top: leftTop, bottom: leftBottom }].forEach(item => {
                    const direction = new THREE.Vector3().subVectors(item.top, item.bottom);
                    const length = direction.length();
                    const cylinderGeo = new THREE.CylinderGeometry(0.08, 0.08, length, 6);
                    const cylinder = new THREE.Mesh(cylinderGeo, hangerMaterial);
                    cylinder.castShadow = true;
                    cylinder.receiveShadow = true;
                    const midPoint = new THREE.Vector3().addVectors(item.bottom, item.top).multiplyScalar(0.5);
                    cylinder.position.copy(midPoint);
                    cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());
                    bridgeGroup.add(cylinder);
                });
            });
            
            // 桥墩
            const pierMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
            const pierGeo = new THREE.BoxGeometry(2, 3, 6);
            const pier1 = new THREE.Mesh(pierGeo, pierMat);
            pier1.position.set(0, 0, -3);
            pier1.receiveShadow = true;
            pier1.castShadow = true;
            bridgeGroup.add(pier1);
            const pier2 = pier1.clone();
            pier2.position.set(span, 0, -3);
            bridgeGroup.add(pier2);
        }

        // --- 导出节点单元信息 ---
        function generateFEMData() {
            const span = parseFloat(document.getElementById('span-slider').value);
            const archH = parseFloat(document.getElementById('arch-slider').value);
            const spacing = parseFloat(document.getElementById('spacing-slider').value);
            const beamPositions = [];
            for (let x = 0; x <= span + 0.01; x += spacing) beamPositions.push(Math.min(x, span));
            if (!beamPositions.includes(span)) beamPositions.push(span);
            beamPositions.sort((a,b)=>a-b);
            
            let nodes = [];
            let nodeId = 1;
            const nodeMap = new Map();
            
            function addNode(x, y, z, desc) {
                const key = `${x.toFixed(3)},${y.toFixed(3)},${z.toFixed(3)}`;
                if (!nodeMap.has(key)) {
                    nodeMap.set(key, nodeId);
                    nodes.push({ id: nodeId, x, y, z, desc });
                    nodeId++;
                }
                return nodeMap.get(key);
            }
            
            const segs = 20;
            const archRightNodes = [], archLeftNodes = [];
            for (let i = 0; i <= segs; i++) {
                const x = (i / segs) * span;
                const r = getArchCoords(x, span, archH, 1);
                const l = getArchCoords(x, span, archH, -1);
                archRightNodes.push(addNode(x, r.y, r.z, `拱右_${i}`));
                archLeftNodes.push(addNode(x, l.y, l.z, `拱左_${i}`));
            }
            
            const deckNodes = [];
            for (let i = 0; i <= 10; i++) {
                const x = (i / 10) * span;
                deckNodes.push(addNode(x, 0, 0.5, `主梁中心_${i}`));
            }
            
            const zBeam = -1.0 - 0.125;
            const beamEndNodes = [];
            beamPositions.forEach(x => {
                const idR = addNode(x, 5, zBeam, `横梁右端_x${x.toFixed(1)}`);
                const idL = addNode(x, -5, zBeam, `横梁左端_x${x.toFixed(1)}`);
                beamEndNodes.push({ x, idR, idL });
            });
            
            let elements = [];
            for (let i = 0; i < segs; i++) {
                elements.push({ type: 'Arch', nodes: [archRightNodes[i], archRightNodes[i+1]] });
                elements.push({ type: 'Arch', nodes: [archLeftNodes[i], archLeftNodes[i+1]] });
            }
            for (let i = 0; i < deckNodes.length-1; i++) elements.push({ type: 'Deck', nodes: [deckNodes[i], deckNodes[i+1]] });
            beamEndNodes.forEach(item => elements.push({ type: 'CrossBeam', nodes: [item.idL, item.idR] }));
            beamEndNodes.forEach(item => {
                const x = item.x;
                const rA = getArchCoords(x, span, archH, 1);
                const lA = getArchCoords(x, span, archH, -1);
                const nR = addNode(x, rA.y, rA.z, `拱右吊点_x${x.toFixed(1)}`);
                const nL = addNode(x, lA.y, lA.z, `拱左吊点_x${x.toFixed(1)}`);
                elements.push({ type: 'Hanger', nodes: [item.idR, nR] });
                elements.push({ type: 'Hanger', nodes: [item.idL, nL] });
            });
            
            let output = "========== 节点坐标 ==========\nID\tX\tY\tZ\t描述\n";
            nodes.sort((a,b)=>a.id-b.id).forEach(n => output += `${n.id}\t${n.x.toFixed(3)}\t${n.y.toFixed(3)}\t${n.z.toFixed(3)}\t${n.desc}\n`);
            output += "\n========== 单元信息 ==========\n类型\t节点I\t节点J\n";
            elements.forEach(el => output += `${el.type}\t${el.nodes[0]}\t${el.nodes[1]}\n`);
            output += `\n总计节点: ${nodes.length}, 单元: ${elements.length}`;
            return output;
        }

        // --- OBJ导出功能 ---
        function exportOBJ() {
            const exporter = new OBJExporter();
            const result = exporter.parse(bridgeGroup);
            const blob = new Blob([result], {type: 'text/plain'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'arch_bridge.obj';
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // --- 初始化与事件绑定 ---
        function setSliderValue(id, value) {
            const el = document.getElementById(id);
            if (!Number.isFinite(value)) return;
            const min = Number(el.min);
            const max = Number(el.max);
            el.value = String(Math.min(max, Math.max(min, value)));
        }

        function applyInitialParam(id, key, fallback) {
            const raw = query.get(key);
            const parsed = raw === null ? fallback : Number(raw);
            setSliderValue(id, parsed);
        }

        applyInitialParam('span-slider', 'span', 60);
        applyInitialParam('arch-slider', 'arch', 20);
        applyInitialParam('spacing-slider', 'spacing', 4);
        rebuildBridge();

        window.setBridgeParams = function(params = {}) {
            if (params.span !== undefined) setSliderValue('span-slider', Number(params.span));
            if (params.arch !== undefined) setSliderValue('arch-slider', Number(params.arch));
            if (params.spacing !== undefined) setSliderValue('spacing-slider', Number(params.spacing));
            rebuildBridge();
        };

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'setBridgeParams') {
                window.setBridgeParams(event.data);
            }
        });
        
        document.getElementById('span-slider').addEventListener('input', rebuildBridge);
        document.getElementById('arch-slider').addEventListener('input', rebuildBridge);
        document.getElementById('spacing-slider').addEventListener('input', rebuildBridge);
        
        document.getElementById('export-btn').addEventListener('click', () => {
            document.getElementById('output-content').textContent = generateFEMData();
            document.getElementById('output-panel').style.display = 'block';
        });
        
        document.getElementById('export-obj-btn').addEventListener('click', exportOBJ);
        
        document.getElementById('toggle-output-btn').addEventListener('click', () => {
            const panel = document.getElementById('output-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        });
        document.getElementById('close-output').addEventListener('click', () => {
            document.getElementById('output-panel').style.display = 'none';
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            css2DRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            css2DRenderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
